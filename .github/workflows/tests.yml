name: Testing & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: ncdc_greengrid_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install API dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt

    - name: Install ETL dependencies
      run: pip install -r greengrid_etl/etl_requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 api/ greengrid_etl/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r api/ greengrid_etl/ -f json -o bandit-report.json || true

